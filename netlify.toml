[build]
  # `npm ci` explicitly: lockfile enforcement should be a property of this
  # repository, not of the build platform's default install heuristics.
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Declared here rather than relying on the host to inject it, so the
    # posture is described by this repo and survives a platform change.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Strict CSP: no third-party scripts/styles; self-hosted only.
    # No 'unsafe-inline' for styles: the build emits no inline <style> and no
    # style="" markup. Dynamic styling goes through the CSSOM, which CSP does
    # not police. Verified against the production build with a
    # securitypolicyviolation listener: zero violations.
    # No blob: in worker-src: the only worker is the classic script at /sw.js.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; require-trusted-types-for 'script'"

# HTML + SW must revalidate so deploys aren't stuck on an old precache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts and the logo are content-hashed into /assets/ by the build, so this
# one rule covers them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
