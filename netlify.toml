[build]
  # The gate. Netlify publishes only if this command succeeds, so any failing
  # check here blocks the deploy outright — no dashboard setting or branch
  # protection required.
  #
  # `build:verified` = unit tests, entropy/descriptor property tests, the
  # production build, the offline artefact, and its self-containment check.
  # These are fast (~5s) and need no browser.
  #
  # The Playwright suite is NOT run here: it needs a browser download on every
  # deploy. It runs in GitHub Actions instead — see .github/workflows/ci.yml.
  #
  # `npm ci` explicitly: lockfile enforcement should be a property of this
  # repository, not of the build platform's default install heuristics.
  command = "npm ci && npm run build:verified"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # Declared here rather than relying on the host to inject it, so the
    # posture is described by this repo and survives a platform change.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Strict CSP: no third-party scripts/styles; self-hosted only.
    # No 'unsafe-inline' for styles: the build emits no inline <style> and no
    # style="" markup. Dynamic styling goes through the CSSOM, which CSP does
    # not police. Verified against the production build with a
    # securitypolicyviolation listener: zero violations.
    # No blob: in worker-src: the only worker is the classic script at /sw.js.
    #
    # `require-trusted-types-for 'script'` is deliberately NOT set. It was
    # tried and reverted: Vue's runtime writes to Trusted Types sinks
    # internally, producing violations on every render (caught by
    # tests/e2e/hosted.spec.js). Enabling it needs a Trusted Types policy
    # around the framework, which buys little here — the app has no innerHTML
    # sink of its own and no user-controlled markup.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"

# HTML + SW must revalidate so deploys aren't stuck on an old precache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fonts and the logo are content-hashed into /assets/ by the build, so this
# one rule covers them.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
